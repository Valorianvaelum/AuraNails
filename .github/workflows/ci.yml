name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "chore/**"
      - "docs/**"
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Check Django configuration
        run: python manage.py check

      - name: Check production security
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: "ci-only-production-check-secret-key-with-sufficient-length"
          DJANGO_ALLOWED_HOSTS: "app.example.com"
          DJANGO_CORS_ALLOWED_ORIGINS: "https://app.example.com"
          DJANGO_CSRF_TRUSTED_ORIGINS: "https://app.example.com"
          DJANGO_BEHIND_HTTPS_PROXY: "true"
        run: python manage.py check --deploy --fail-level WARNING

      - name: Check pending migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run backend tests
        run: python manage.py test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  production-stack:
    name: Production stack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare smoke environment
        run: cp .env.production.smoke.example .env.production

      - name: Validate production Compose
        run: docker compose --env-file .env.production -f docker-compose.production.yml config

      - name: Validate restore Compose
        run: docker compose --env-file .env.production -f docker-compose.restore.yml --profile verify config

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $allErrors = @()
          foreach ($script in @("scripts/backup-production.ps1", "scripts/verify-restore.ps1")) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            $allErrors += $parseErrors
          }
          if ($allErrors.Count -gt 0) {
            $allErrors | Format-List | Out-String | Write-Error
            exit 1
          }

      - name: Build production images
        run: docker compose --env-file .env.production -f docker-compose.production.yml build

      - name: Build restore verifier
        run: docker compose --env-file .env.production -f docker-compose.restore.yml --profile verify build verifier
